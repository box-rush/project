# T18: dependency updates. Security updates arrive whenever GitHub has an advisory; version updates weekly, grouped
# so one person can review them (minor / patch together; majors one by one).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Tokyo }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /infra
    schedule: { interval: monthly }
